<div id="app">
  <header class="bar">
    <div class="brand">
      <span class="seal" aria-hidden="true">陣</span>
      <div class="brand-text">
        <div class="title">陣触<small>戦国群雄記</small></div>
        <div class="date" id="date">永禄三年六月</div>
      </div>
    </div>
    <dl class="stats" id="stats"></dl>
    <nav class="cmds" aria-label="命令">
      <button type="button" id="btn-naisei" class="plaque" title="内政 (1)">内政</button>
      <button type="button" id="btn-gunji" class="plaque" title="軍事 (2)">軍事</button>
      <button type="button" id="btn-jinji" class="plaque" title="人事 (3)">人事<span class="badge" id="badge-captive" hidden></span></button>
      <button type="button" id="btn-gaiko" class="plaque" title="外交 (4)">外交</button>
      <button type="button" id="btn-akinai" class="plaque" title="商い (5)">商い</button>
      <button type="button" id="btn-kiroku" class="plaque" title="記録 (6)">記録</button>
      <button type="button" id="btn-todo" class="plaque todo" title="今月の要件 (T)" hidden>要件<span class="badge" id="badge-todo"></span></button>
      <button type="button" id="btn-end" class="seal-btn" title="ターン終了 (E)">評定終了</button>
    </nav>
  </header>
  <main class="stage">
    <div class="mapwrap">
      <canvas id="map" aria-label="日本地図"></canvas>
      <div class="mapctl">
        <button type="button" id="zin" aria-label="拡大">＋</button>
        <button type="button" id="zout" aria-label="縮小">－</button>
        <button type="button" id="zhome" aria-label="本城へ">本城</button>
      </div>
      <div class="mapmode" id="mapmode" role="toolbar" aria-label="地図の表示（M）"></div>
      <div class="mapbase" id="mapbase" role="group" aria-label="下絵（ヘックスの濃さ）"></div>
      <div class="legend" id="legend" aria-hidden="true">
        <span><i class="lg lg-p"></i>平地</span><span><i class="lg lg-f"></i>森 守×1.15</span><span><i class="lg lg-m"></i>山 守×1.3</span><span><i class="lg lg-r"></i>川 攻×0.85</span><span><i class="lg lg-c"></i>城 守×1.2〜2.2</span>
      </div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
    <aside class="side">
      <section id="panel" class="panel"></section>
      <section class="logbox">
        <h3>戦況</h3>
        <ol id="log"></ol>
      </section>
    </aside>
  </main>
  <div id="battle" class="bt" hidden>
    <header class="bt-bar">
      <div class="bt-titles"><div class="bt-title" id="bt-title">合戦</div><div class="bt-sub" id="bt-sub"></div></div>
      <div class="bt-clock"><span id="bt-turn"></span><span id="bt-phase" class="bt-phase"></span></div>
      <nav class="cmds">
        <button type="button" class="plaque" id="bt-retreat">退却</button>
        <button type="button" class="plaque" id="bt-auto" title="残りを自動で決着">委任</button>
        <button type="button" class="seal-btn" id="bt-end">手番終了</button>
      </nav>
    </header>
    <div class="bt-body">
      <div class="bt-field"><canvas id="bt-map" aria-label="合戦場"></canvas></div>
      <aside class="bt-side">
        <section id="bt-panel" class="panel"></section>
        <section id="bt-roster" class="bt-roster"></section>
        <ol id="bt-log" class="bt-log"></ol>
      </aside>
    </div>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="close" id="modal-close" aria-label="閉じる">×</button>
      <div id="modal-body"></div>
    </div>
  </div>
</div>
<div id="title" class="ttl" hidden>
  <canvas id="ttl-map" aria-hidden="true"></canvas>
  <div class="ttl-veil" aria-hidden="true"></div>
  <div class="fog f1" aria-hidden="true"></div><div class="fog f2" aria-hidden="true"></div>
  <div id="ttl-body" class="ttl-body"></div>
</div>
